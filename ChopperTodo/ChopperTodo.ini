; =====================================================================
;  Chopper To-Do  -  calendar + task list for Rainmeter
;  Edit the [Variables] section below to restyle it, then right-click the
;  skin > "Refresh skin". Tasks are stored in @Resources\tasks.txt
; =====================================================================

[Rainmeter]
Update=30000
AccurateText=1
DynamicWindowSize=1
MouseScrollUpAction=[!CommandMeasure mScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure mScript "Scroll(1)"]

[Metadata]
Name=Chopper To-Do
Author=Claude
Version=1.0
Information=Monthly calendar + task list. Click a day to filter/assign tasks.

[Variables]
; ---------- COLORS  (Red,Green,Blue,Alpha 0-255) ----------
ColorCard=255,246,247,190
ColorCardStroke=255,255,255,230
ColorText=112,66,70
ColorMuted=176,142,145
ColorAccent=232,110,122
ColorAccent2=104,160,178
ColorEvent=245,175,50
ColorLine=214,170,176,140
ColorBox=255,255,255,210
; ---------- FONTS ----------
FontMain=Segoe UI
FontTitle=Segoe Print
; ---------- OPTIONS ----------
TitleText=Chopper's To-Do
; 0 = week starts Sunday, 1 = week starts Monday
WeekStart=0
NewTask=

; ---------- the logic (Lua) ----------
[mScript]
Measure=Script
ScriptFile=#CURRENTPATH#Todo.lua
UseUnicode=1

; ---------- the "type a task" box ----------
[mInput]
Measure=Plugin
Plugin=InputText
X=346
Y=380
W=310
H=26
FontFace=#FontMain#
FontSize=11
FontColor=#ColorText#
SolidColor=255,255,255,255
FocusDismiss=0
DefaultValue=#NewTask#
Command1=[!SetVariable NewTask "$UserInput$"][!CommandMeasure mScript "CaptureTaskName()"]
OnDismissAction=[!CommandMeasure mScript "CancelAdd()"]
DynamicVariables=1

; ---------- styles ----------
[StyleText]
FontFace=#FontMain#
FontColor=#ColorText#
FontSize=11
AntiAlias=1
DynamicVariables=1

[StyleSmall]
FontFace=#FontMain#
FontColor=#ColorMuted#
FontSize=9
AntiAlias=1
DynamicVariables=1

; =====================================================================
;  CARD + HEADER
; =====================================================================
[Card]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,680,[&mScript:CardHeight()],24 | Fill Color #ColorCard# | Stroke Color #ColorCardStroke# | StrokeWidth 2
Shape2=Rectangle 22,52,636,2,1 | Fill LinearGradient HeaderGrad | StrokeWidth 0
Shape3=Line 322,66,322,400 | Stroke Color #ColorLine# | StrokeWidth 1
HeaderGrad=0 | #ColorAccent# ; 0.0 | #ColorAccent2# ; 1.0
DynamicVariables=1

; Chopper's hat cross
[Logo]
Meter=Shape
X=20
Y=12
Shape=Ellipse 16,16,15 | Fill Color #ColorAccent# | Stroke Color 255,255,255,255 | StrokeWidth 2
Shape2=Rectangle 13,7,6,18,2 | Fill Color 255,255,255 | StrokeWidth 0
Shape3=Rectangle 7,13,18,6,2 | Fill Color 255,255,255 | StrokeWidth 0

[Title]
Meter=String
MeterStyle=StyleText
X=48
Y=11
FontFace=#FontTitle#
FontSize=17
Text=#TitleText#

[TodayLabel]
Meter=String
MeterStyle=StyleText
X=658
Y=18
StringAlign=Right
FontSize=11
FontColor=#ColorAccent2#
Text=[&mScript:TodayLabel()]

; =====================================================================
;  CALENDAR
; =====================================================================
[MonthPrev]
Meter=Shape
X=26
Y=54
PrevPath=17,7 | LineTo 10,14 | LineTo 17,21
Shape=Rectangle 0,0,28,28 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PrevPath | Fill Color 0,0,0,0 | Stroke Color #ColorAccent# | StrokeWidth 2.5 | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
LeftMouseUpAction=[!CommandMeasure mScript "Prev()"]

[MonthNext]
Meter=Shape
X=268
Y=54
NextPath=11,7 | LineTo 18,14 | LineTo 11,21
Shape=Rectangle 0,0,28,28 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path NextPath | Fill Color 0,0,0,0 | Stroke Color #ColorAccent# | StrokeWidth 2.5 | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
LeftMouseUpAction=[!CommandMeasure mScript "Next()"]

[Month]
Meter=String
MeterStyle=StyleText
X=161
Y=60
StringAlign=Center
FontFace=#FontTitle#
FontSize=13
Text=[&mScript:MonthTitle()]

[Wd1]
